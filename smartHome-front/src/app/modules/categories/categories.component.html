<div class="page-wrapper">

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title-section">
      <div class="page-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
        </svg>
      </div>
      <div>
        <h1 class="page-title">Categories</h1>
        <p class="page-subtitle">{{ categories ? categories.length : 0 }} categories configured</p>
      </div>
    </div>
    <button class="btn-add" (click)="openSaveDialog()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-add-icon">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add Category
    </button>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <p-table [value]="categories" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th style="width:80px">#</th>
          <th>Category Name</th>
          <th style="width:200px">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-category>
        <tr>
          <td class="text-muted-cell">{{ category.id }}</td>
          <td>
            <div class="category-label-cell">
              <div class="category-dot"></div>
              <span class="category-name">{{ category.label }}</span>
            </div>
          </td>
          <td>
            <div class="table-actions">
              <button pButton icon="pi pi-pencil" label="Edit" class="p-button-sm p-button-outlined p-button-info" (click)="openUpdateDialog(category)"></button>
              <button pButton icon="pi pi-trash" label="Delete" class="p-button-sm p-button-outlined p-button-danger" (click)="daleteCategorie(category.id)"></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="empty-table-cell">No categories found. Add your first one!</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>



<p-dialog header="Add Category" [(visible)]="displaySaveDialog" [modal]="true" [responsive]="true">
  <div class="p-fluid">
    <div class="p-field">
      <label for="label">Label</label>
      <input id="label" pInputText [(ngModel)]="newCategorie.label" />
    </div>
  </div>

  <div class="p-dialog-footer mt-2">
    <button pButton label="Save" class="p-button-success" (click)="saveCategorie()"></button>
    <button pButton label="Cancel" class="p-button-secondary" (click)="displaySaveDialog = false"></button>
  </div>
</p-dialog>
<p-dialog header="Update Category" [(visible)]="displayUpdateDialog" [modal]="true" [responsive]="true">
  <div class="p-fluid">
    <div class="p-field">
      <label for="updateLabel">Label</label>
      <input id="updateLabel" pInputText [(ngModel)]="selectedCategorie.label" />
    </div>
  </div>

  <div class="p-dialog-footer">
    <button pButton label="Update" class="p-button-success" (click)="updateCategorie()"></button>
    <button pButton label="Cancel" class="p-button-secondary" (click)="displayUpdateDialog = false"></button>
  </div>
</p-dialog>
